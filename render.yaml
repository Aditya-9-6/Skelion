services:
  - type: web
    name: skelion-control
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run_control_plane.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URI
        value: sqlite:///./skelion.db
      - key: SKELION_PORT
        value: 8002
