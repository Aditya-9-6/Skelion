name: Skelion Website CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Typecheck Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck & Lint
        run: npm run lint

      - name: Production Vite Build
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html!"; exit 1; }
          echo "Website build completed successfully. Ready for Vercel deployment."
