services:
  postgres:
    image: postgres:15-alpine
    container_name: helios-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helios_secret}
      POSTGRES_DB: ${POSTGRES_DB:-helios_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: helios-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-razorpay:
    image: wiremock/wiremock:3.5.4-alpine
    container_name: helios-mock-razorpay
    restart: always
    ports:
      - "8089:8080"
    volumes:
      - ./deploy/wiremock:/home/wiremock
    command: ["--global-response-templating", "--verbose"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.saas
    container_name: helios-web
    restart: always
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://helios:helios_secret@postgres:5432/helios_db
      - REDIS_URL=redis://redis:6379/0
      - RAZORPAY_KEY_ID=rzp_test_mock_key
      - RAZORPAY_KEY_SECRET=rzp_mock_secret
      - RAZORPAY_WEBHOOK_SECRET=rzp_webhook_secret_placeholder
      - RAZORPAY_API_BASE=http://mock-razorpay:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-razorpay:
        condition: service_healthy

volumes:
  postgres_data:
