version: '3.8'

services:
  skelion-control-plane:
    build: .
    ports:
      - '8003:8003'
    environment:
      - PORT=8003
      - ENVIRONMENT=production
    restart: always

  spryzen-waf:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - skelion-control-plane
