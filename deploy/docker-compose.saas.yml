version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: skelion-caddy-ssl
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - skelion-control-plane

  skelion-control-plane:
    build:
      context: ..
      dockerfile: Dockerfile.saas
    container_name: skelion-control-plane
    restart: always
    environment:
      - ENVIRONMENT=production
      - PORT=8003
      - DATABASE_URL=postgresql://skelion:skelion_secret@postgres:5432/skelion_db
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: skelion-postgres
    restart: always
    environment:
      POSTGRES_USER: skelion
      POSTGRES_PASSWORD: skelion_secret
      POSTGRES_DB: skelion_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skelion -d skelion_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skelion-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
