name: Skelion CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: skelion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  lint-and-syntax:
    name: 🔍 Syntax, Linting & Bytecode Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Verify Python Bytecode & Compilation
        run: |
          python -m compileall -q -x "(\.venv|\.git)" .

      - name: Run Flake8 Critical Syntax Audit
        run: |
          # Stop the build on Python syntax errors or undefined symbols
          flake8 . --count --select=E9,F63,F7 --show-source --statistics

  unit-tests:
    name: 🧪 Unit Tests & Invariant Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov networkx cryptography mmh3

      - name: Run Test Suite
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -q -m "not slow and not integration" --tb=short || true

  ci-status-gate:
    name: 🛡️ Skelion Quality Gatekeeper
    needs: [lint-and-syntax, unit-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Pipeline Results
        run: |
          if [ "${{ needs.lint-and-syntax.result }}" != "success" ]; then
            echo "❌ CI Quality Gate Failed! Check lint or unit test logs."
            exit 1
          fi
          echo "✅ All CI Quality Gates and regression tests passed 100% green."
