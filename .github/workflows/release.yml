name: Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skelion_vscode_extension
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run VS Code tests (optional)
        run: |
          if npm run test; then echo "Tests passed"; else echo "No test script defined"; fi

      - name: Package VSIX
        run: |
          npm install -g @vscode/vsce
          vsce package --allow-missing-repository
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

      - name: Upload VSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: skelion-vscode-extension
          path: skelion_vscode_extension/*.vsix

      - name: Publish to Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          vsce publish --pat ${{ secrets.VSCE_TOKEN }}
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
