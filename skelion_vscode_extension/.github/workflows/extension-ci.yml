# .github/workflows/extension-ci.yml
# CI pipeline for Skelion VS Code Extension
# Runs on Ubuntu and Windows to verify cross‑platform compatibility.

name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Run unit & integration tests
        run: npm test
      - name: Build extension
        run: npm run compile
      - name: Package VSIX
        run: npx vsce package -o skelion-vscode-${{ github.run_number }}.vsix
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: skelion-vsix
          path: skelion-vscode-${{ github.run_number }}.vsix

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install VS Code Test dependencies
        run: npm install -g @vscode/vscode-test
      - name: Run end‑to‑end tests
        run: ./scripts/e2e-test.sh
